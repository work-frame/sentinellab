name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm --filter "./packages/*" run build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build apps
        run: pnpm build

  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinellab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sentinellab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinellab" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sentinellab:ci-only-password@localhost:5432/sentinellab_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sentinellab/api exec prisma generate
      - name: Integration tests (auth, authorization, SSRF, scans, reports)
        run: pnpm test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinellab
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sentinellab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinellab" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinellab:ci-only-password@localhost:5432/sentinellab?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
      DEMO_TARGETS: vulnerable-web=http://localhost:8081/,vulnerable-api=http://localhost:8082/
      REGISTER_RATE_LIMIT: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:migrate
      - name: Start demo targets, API and web
        run: |
          PORT=8081 HOST=127.0.0.1 node targets/vulnerable-web/server.js > /tmp/vulnerable-web.log 2>&1 &
          PORT=8082 HOST=127.0.0.1 node targets/vulnerable-api/server.js > /tmp/vulnerable-api.log 2>&1 &
          (cd apps/api && node dist/main.js > /tmp/api.log 2>&1 &)
          (cd apps/web && pnpm start > /tmp/web.log 2>&1 &)
          for url in http://localhost:4000/api/health http://localhost:3000/login http://localhost:8081/ http://localhost:8082/; do
            for i in $(seq 1 60); do curl -fsS "$url" > /dev/null && break; sleep 1; done
            curl -fsS "$url" > /dev/null || { echo "$url did not start"; cat /tmp/*.log; exit 1; }
          done
      - name: Install Chromium
        run: pnpm --filter @sentinellab/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7
      - name: Show server logs
        if: failure()
        run: tail -n 100 /tmp/*.log

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fail on high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/api.Dockerfile -t sentinellab-api .
      - run: docker build -f infrastructure/docker/web.Dockerfile -t sentinellab-web .
      - run: docker build -t sentinellab-vulnerable-web targets/vulnerable-web
      - run: docker build -t sentinellab-vulnerable-api targets/vulnerable-api
